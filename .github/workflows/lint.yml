name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Ruff + Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app/python tools tests docs/img
      - name: Pylint
        env:
          PYTHONPATH: app/python:tools/sim:tools/bench
        run: pylint app/python/open_fp tools/sim tools/bench --fail-under=9

  generated:
    name: Generated files up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Diagrams match their generators
        run: |
          for gen in docs/img/make_*.py; do python "$gen"; done
          git diff --exit-code -- docs/img/ || {
            echo "::error::A diagram in docs/img/ is stale. Run its docs/img/make_*.py script and commit the result."
            exit 1
          }

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        # SC2029 (info) flags intentional client-side expansion in ssh commands.
        run: shellcheck --severity=warning tools/*.sh tools/bench/*.sh
