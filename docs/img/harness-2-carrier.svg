<text x="58" y="50" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="88" y="52" font-size="24" font-weight="700" fill="#1F2933" text-anchor="start">Put four units on a carrier (×2)</text>
<text x="40" y="88" font-size="14" font-weight="400" fill="#5F6B78" text-anchor="start">A carrier is a perfboard with 5 bus rails. Every unit taps all five rails; its CS wire and cell cable leave from the bottom edge.</text>
<rect x="70" y="130" width="1140" height="510" rx="12" fill="#F6F4EF" stroke="#7A7063" stroke-width="2"/>
<text x="640.0" y="158" font-size="13" font-weight="700" fill="#7A7063" text-anchor="middle">Toe carrier (perfboard). The heel carrier is identical, with L3, L4, R3, R4.</text>
